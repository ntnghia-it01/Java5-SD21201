<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
  <body>
    <div class="container">
    	<div class="col-6 offset-3">
    		<!-- Khai báo một đối tượng có giá trị là bean được gửi từ controller qua  -->
    		<!-- Bean này sẽ chứa các giá trị input đã nhập trước đó và lỗi nếu có -->
    		<form method="post" action="/register">
    			<div class="mb-3">
				  <label class="form-label">Tên sản phẩm</label>
				  <input type="text" class="form-control" name="name">
				</div>
				<div class="mb-3">
				  <label class="form-label">Mô tả</label>
				  <textarea name="desc" class="form-control" id="exampleFormControlTextarea1" rows="3"></textarea>
				</div>
				<div class="mb-3">
				  <label class="form-label">Giá</label>
				  <input type="text" class="form-control" name="price">
				</div>
				<div class="mb-3">
				  <label class="form-label">Số lượng</label>
				  <input type="text" class="form-control" name="quantity">
				</div>
				
				<div class="mb-3">
				  <label class="form-label">Danh mục</label>
				  <select class="form-select" aria-label="Default select example">
					  <option selected>Open this select menu</option>
					  <option value="1">One</option>
					  <option value="2">Two</option>
					  <option value="3">Three</option>
					</select>
				</div>
				<div class="mb-3">
				  <label class="form-label">Ảnh</label>
				  <input name="images" multiple accept="image/*" class="form-control" type="file" id="formFile">
				</div>
				
				<div class="mb-3">
				  <label class="form-label">Trạng thái</label>
				  <div class="form-check">
					  <input class="form-check-input" type="radio" name="flexRadioDefault" id="flexRadioDefault1">
					  <label class="form-check-label" for="flexRadioDefault1">
					    Đang bán
					  </label>
					</div>
					<div class="form-check">
					  <input class="form-check-input" type="radio" name="flexRadioDefault" id="flexRadioDefault2" checked>
					  <label class="form-check-label" for="flexRadioDefault2">
					    Ngừng bán
					  </label>
					</div>
				</div>
				<input value="Thêm sản phẩm" class="btn btn-primary" type="submit">
    		</form>
    	</div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
