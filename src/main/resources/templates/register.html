<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
  <body>
    <div class="container">
    	<div class="col-6 offset-3">
    		<!-- Khai báo một đối tượng có giá trị là bean được gửi từ controller qua  -->
    		<!-- Bean này sẽ chứa các giá trị input đã nhập trước đó và lỗi nếu có -->
    		<form th:object="${bean}" method="post" action="/register">
    			<div class="mb-3">
				  <label class="form-label">Tên tài khoản</label>
				  <!-- Khi đã dùng th:object -->
				  <!-- Để hiển thị giá trị đã nhập => th:field="*{tên thuộc tính}" -->
				  <input th:field="*{username}" type="text" class="form-control" name="username">
				  <small class="text-danger" th:errors="*{username}"></small>
				</div>
				<div class="mb-3">
				  <label class="form-label">Mật khẩu</label>
				  <input th:field="*{password}" type="password" class="form-control" name="password">
				  <small class="text-danger" th:errors="*{password}"></small>
				</div>
				<div class="mb-3">
				  <label class="form-label">Họ và tên</label>
				  <input th:field="*{name}" type="text" class="form-control" name="name">
				  <small class="text-danger" th:errors="*{name}"></small>
				</div>
				<div class="mb-3">
				  <label class="form-label">Email</label>
				  <input th:field="*{email}" type="text" class="form-control" name="email">
				  <small class="text-danger" th:errors="*{email}"></small>
				</div>
				<div class="mb-3">
				  <label class="form-label">Số điện thoại</label>
				  <input th:field="*{phone}" type="text" class="form-control" name="phone">
				  <small class="text-danger" th:errors="*{phone}"></small>
				</div>
				
				<input value="Đăng ký" class="btn btn-primary" type="submit">
    		</form>
    	</div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
