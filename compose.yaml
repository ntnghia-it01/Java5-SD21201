name: java5

x-sql-image: &sql-image mcr.microsoft.com/mssql/server:2022-latest

services:
  sqlserver:
    image: *sql-image
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Create .env with a strong SQL password}
    volumes:
      - sqlserver_data:/var/opt/mssql
    # Không publish cổng 1433 ra VPS/Internet.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          SQLCMDPASSWORD="$${MSSQL_SA_PASSWORD}"
          /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -Q "SELECT 1"
          > /dev/null
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db-init:
    image: *sql-image
    platform: linux/amd64
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      SQLCMDPASSWORD: ${MSSQL_SA_PASSWORD:?Create .env with a strong SQL password}
      DB_NAME: ${DB_NAME:?Set DB_NAME in .env}
    volumes:
      - ./deploy/init-db.sql:/init/init-db.sql:ro
      - ./deploy/init-db.sh:/init/init-db.sh:ro
    entrypoint: ["/bin/sh", "/init/init-db.sh"]
    restart: "no"
    logging: *logging

  app:
    build:
      context: .
    image: java5-app:${APP_VERSION:?Set APP_VERSION in .env}
    pull_policy: never
    environment:
      SERVER_PORT: "8080"
      DB_URL: jdbc:sqlserver://sqlserver:1433;databaseName=${DB_NAME:?Set DB_NAME in .env};encrypt=true;trustServerCertificate=true
      DB_USERNAME: sa
      DB_PASSWORD: ${MSSQL_SA_PASSWORD:?Create .env with a strong SQL password}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "true"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - uploads:/app/images-upload
    depends_on:
      sqlserver:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    restart: unless-stopped
    logging: *logging

volumes:
  sqlserver_data:
  uploads:
